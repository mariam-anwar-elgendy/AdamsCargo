{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">✏️ تعديل الرحلة #{{ trip.id }}</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_trip', id=trip.id) }}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">📅 التاريخ</label>
                            <input type="date" name="date" class="form-control" value="{{ trip.date }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">🚗 رقم اللوحة</label>
                            <input type="text" name="plate_number" class="form-control" value="{{ trip.car.plate_number if trip.car else '' }}" list="cars-list">
                            <datalist id="cars-list">
                                {% for car in cars %}
                                <option value="{{ car.plate_number }}">
                                {% endfor %}
                            </datalist>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">👨‍✈️ اسم السائق</label>
                            <input type="text" name="driver_name" class="form-control" value="{{ trip.driver_name }}" required>
                        </div>
                    </div>

                    <div class="row g-3 mt-2">
                        <div class="col-md-6">
                            <label class="form-label">👤 اسم العميل</label>
                            <input type="text" name="customer_name" class="form-control" value="{{ trip.customer.name if trip.customer else '' }}" list="customers-list">
                            <datalist id="customers-list">
                                {% for customer in customers %}
                                <option value="{{ customer.name }}">
                                {% endfor %}
                            </datalist>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">📞 تليفون العميل</label>
                            <input type="text" name="customer_phone" class="form-control" value="{{ trip.customer.phone if trip.customer else '' }}">
                        </div>
                    </div>

                    <div class="row g-3 mt-2">
                        <div class="col-md-6">
                            <label class="form-label">📍 من</label>
                            <input type="text" name="from_location" class="form-control" value="{{ trip.from_location }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">📍 إلى</label>
                            <input type="text" name="to_location" class="form-control" value="{{ trip.to_location }}">
                        </div>
                    </div>

                    <div class="row g-3 mt-2">
                        <div class="col-md-4">
                            <label class="form-label">💰 النولون</label>
                            <input type="number" name="nauloon" class="form-control" step="0.01" value="{{ trip.nauloon }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">⛽ السولار</label>
                            <input type="number" name="solar" class="form-control" step="0.01" value="{{ trip.solar }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">💸 المصاريف</label>
                            <input type="number" name="expenses" class="form-control" step="0.01" value="{{ trip.expenses }}">
                        </div>
                    </div>

                    <div class="row g-3 mt-2">
                        <div class="col-md-4">
                            <label class="form-label">👨‍✈️ أجرة السائق</label>
                            <input type="number" name="driver_pay" class="form-control" step="0.01" value="{{ trip.driver_pay }}">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">📝 ملاحظات</label>
                            <textarea name="notes" class="form-control" rows="3">{{ trip.notes }}</textarea>
                        </div>
                    </div>

                    <div class="mt-4 text-center">
                        <button type="submit" class="btn btn-warning btn-lg px-5">💾 حفظ التعديلات</button>
                        <a href="{{ url_for('trips_list') }}" class="btn btn-secondary btn-lg px-5">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
