{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🚗 العربيات</h2>
</div>
<div class="row">
    {% for car in cars %}
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ car.plate_number }}</h5>
                <p class="small text-muted">قسط البنك: {{ car.bank_installment }} ج.م</p>
                <p class="small text-muted">المتبقي للبنك: {{ car.remaining_bank }} ج.م</p>
                <a href="{{ url_for('car_report', cid=car.id) }}" class="btn btn-sm btn-info text-white">تقرير</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12 text-center text-muted py-5"><h4>لا توجد عربيات.</h4></div>
    {% endfor %}
</div>
{% endblock %}
