{% extends 'base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2>✏️ تعديل الرحلة</h2>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">التاريخ</label>
                    <input type="date" class="form-control" name="date" value="{{ trip.date }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">السائق</label>
                    <input type="text" class="form-control" name="driver_name" value="{{ trip.driver_name }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">العربية</label>
                    <select class="form-select" name="car_id">
                        {% for car in cars %}
                        <option value="{{ car.id }}" {% if trip.car_id == car.id %}selected{% endif %}>{{ car.plate_number }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">العميل</label>
                    <select class="form-select" name="customer_id">
                        {% for customer in customers %}
                        <option value="{{ customer.id }}" {% if trip.customer_id == customer.id %}selected{% endif %}>{{ customer.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">من</label>
                    <input type="text" class="form-control" name="from_location" value="{{ trip.from_location or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">إلى</label>
                    <input type="text" class="form-control" name="to_location" value="{{ trip.to_location or '' }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">النولون</label>
                    <input type="number" step="0.01" class="form-control" name="nauloon" value="{{ trip.nauloon }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">السولار</label>
                    <input type="number" step="0.01" class="form-control" name="solar" value="{{ trip.solar }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">المصاريف</label>
                    <input type="number" step="0.01" class="form-control" name="expenses" value="{{ trip.expenses }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">أجرة السائق</label>
                    <input type="number" step="0.01" class="form-control" name="driver_pay" value="{{ trip.driver_pay }}">
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea class="form-control" name="notes" rows="2">{{ trip.notes or '' }}</textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-warning">حفظ التعديلات</button>
            <a href="{{ url_for('trips_list') }}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>
</div>
{% endblock %}
