{% extends 'base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h2>✏️ تعديل الرحلة #{{ trip.id }}</h2>
        <a href="{{ url_for('trips_list') }}" class="btn btn-secondary">رجوع</a>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('edit_trip', tid=trip.id) }}">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">التاريخ</label>
                    <input type="date" class="form-control" name="date" value="{{ trip.date }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">رقم اللوحة</label>
                    <input type="text" class="form-control" name="plate_number" value="{{ trip.car.plate_number if trip.car else '' }}" list="carsList">
                    <datalist id="carsList">
                        {% for car in cars %}
                        <option value="{{ car.plate_number }}">
                        {% endfor %}
                    </datalist>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">اسم السائق</label>
                    <input type="text" class="form-control" name="driver_name" value="{{ trip.driver_name }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">اسم العميل</label>
                    <input type="text" class="form-control" name="customer_name" value="{{ trip.customer.name if trip.customer else '' }}" list="customersList">
                    <datalist id="customersList">
                        {% for customer in customers %}
                        <option value="{{ customer.name }}">
                        {% endfor %}
                    </datalist>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">تليفون العميل</label>
                    <input type="text" class="form-control" name="customer_phone" value="{{ trip.customer.phone if trip.customer else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">من</label>
                    <input type="text" class="form-control" name="from_location" value="{{ trip.from_location or '' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">إلى</label>
                    <input type="text" class="form-control" name="to_location" value="{{ trip.to_location or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">النولون</label>
                    <input type="number" step="0.01" class="form-control" name="nauloon" value="{{ trip.nauloon }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">السولار</label>
                    <input type="number" step="0.01" class="form-control" name="solar" value="{{ trip.solar }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">المصاريف</label>
                    <input type="number" step="0.01" class="form-control" name="expenses" value="{{ trip.expenses }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">أجرة السائق</label>
                    <input type="number" step="0.01" class="form-control" name="driver_pay" value="{{ trip.driver_pay }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">الصافي (تلقائي)</label>
                    <input type="text" class="form-control" value="{{ trip.net_profit }}" readonly>
                </div>
            </div>

            <div class="row">
                <div class="col-12 mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea class="form-control" name="notes" rows="3">{{ trip.notes or '' }}</textarea>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
                <a href="{{ url_for('trips_list') }}" class="btn btn-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
