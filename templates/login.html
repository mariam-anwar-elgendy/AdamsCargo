{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">🚚 تسجيل الدخول</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">اسم المستخدم</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="أدخل اسم المستخدم">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">كلمة المرور</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="أدخل كلمة المرور">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">دخول</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
