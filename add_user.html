{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white"><h5 class="mb-0">➕ إضافة مستخدم جديد</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label>اسم المستخدم</label><input type="text" name="username" class="form-control" required></div>
                    <div class="mb-3"><label>الاسم الكامل</label><input type="text" name="full_name" class="form-control" required></div>
                    <div class="mb-3"><label>كلمة المرور</label><input type="text" name="password" class="form-control" required></div>
                    <div class="mb-3"><label>الصلاحية</label><select name="role" class="form-select"><option value="user">مستخدم</option><option value="admin">مدير</option></select></div>
                    <button type="submit" class="btn btn-primary w-100">حفظ المستخدم</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
